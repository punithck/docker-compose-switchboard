services:
  postgres:
    image: postgres:16-alpine
    container_name: switchboard-sample-postgres
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  auth-api:
    image: nginx:1.27-alpine
    container_name: switchboard-sample-auth-api
    ports:
      - "18081:80"
    depends_on:
      - postgres

  orders-api:
    image: nginx:1.27-alpine
    container_name: switchboard-sample-orders-api
    ports:
      - "18082:80"
    depends_on:
      - postgres

volumes:
  postgres-data:
