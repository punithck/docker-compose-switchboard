<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service Switchboard</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f8fb;
      color: #182033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, #eef2f7 0, #f8fafc 260px),
        #f8fafc;
    }

    button, input {
      font: inherit;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      padding: 14px 0 20px;
      border-bottom: 1px solid #d9e0ea;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subhead {
      margin: 8px 0 0;
      color: #607089;
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .search {
      width: min(280px, 40vw);
      height: 38px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0 12px;
      background: #fff;
      color: #182033;
    }

    .button {
      height: 38px;
      border: 1px solid #b9c5d5;
      border-radius: 8px;
      background: #fff;
      color: #233047;
      padding: 0 13px;
      cursor: pointer;
      font-weight: 650;
    }

    .button:hover {
      border-color: #8ea0b8;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 18px 0;
    }

    .metric {
      border: 1px solid #d9e0ea;
      border-radius: 8px;
      background: #fff;
      padding: 14px 16px;
    }

    .metric span {
      display: block;
      color: #64748b;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 750;
    }

    .metric strong {
      display: block;
      margin-top: 6px;
      font-size: 26px;
      line-height: 1;
    }

    .groups {
      display: grid;
      gap: 16px;
    }

    .group {
      border-top: 1px solid #d9e0ea;
      padding-top: 14px;
    }

    .group-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 0;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #52627a;
    }

    .count {
      color: #718096;
      font-size: 13px;
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .service {
      min-height: 156px;
      border: 1px solid #d6dee9;
      border-radius: 8px;
      background: #fff;
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .service.running {
      border-color: #79bd9a;
      box-shadow: inset 4px 0 0 #2f9f68;
    }

    .service.busy {
      opacity: .68;
      pointer-events: none;
    }

    .service-top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
    }

    .name {
      min-width: 0;
    }

    .name strong {
      display: block;
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .name span {
      display: block;
      color: #718096;
      font-size: 12px;
      margin-top: 4px;
      overflow-wrap: anywhere;
    }

    .switch {
      position: relative;
      display: inline-flex;
      width: 54px;
      height: 30px;
      flex: 0 0 auto;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: #a8b3c2;
      cursor: pointer;
      transition: background .18s ease;
    }

    .slider:before {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 6px rgba(15, 23, 42, .25);
      transition: transform .18s ease;
    }

    input:checked + .slider {
      background: #2f9f68;
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      min-height: 26px;
      align-items: flex-start;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #eef2f7;
      color: #46566f;
      font-size: 12px;
      font-weight: 650;
    }

    .pill.running {
      background: #ddf4e8;
      color: #176c44;
    }

    .pill.stopped {
      background: #f1f3f6;
      color: #667085;
    }

    .description {
      margin: 0;
      color: #52627a;
      line-height: 1.4;
      font-size: 13px;
      min-height: 18px;
    }

    .service-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .link {
      color: #1864ab;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .restart {
      border: 0;
      background: transparent;
      color: #52627a;
      font-weight: 750;
      cursor: pointer;
      padding: 6px 0;
    }

    .restart:hover {
      color: #182033;
    }

    .empty, .error {
      border: 1px solid #d9e0ea;
      border-radius: 8px;
      background: #fff;
      padding: 18px;
      color: #52627a;
      line-height: 1.45;
    }

    .error {
      border-color: #efb0a8;
      color: #9d2f22;
      background: #fff7f6;
      white-space: pre-wrap;
    }

    @media (max-width: 700px) {
      .shell {
        width: min(100% - 24px, 1180px);
        padding-top: 14px;
      }

      header {
        align-items: stretch;
        flex-direction: column;
      }

      .actions {
        justify-content: flex-start;
      }

      .search {
        width: 100%;
      }

      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>Service Switchboard</h1>
        <p class="subhead">Start only the local Compose services you need.</p>
      </div>
      <div class="actions">
        <input id="search" class="search" placeholder="Filter services" autocomplete="off">
        <button id="refresh" class="button" type="button">Refresh</button>
      </div>
    </header>

    <section class="summary" aria-live="polite">
      <div class="metric"><span>Total</span><strong id="total">0</strong></div>
      <div class="metric"><span>Running</span><strong id="running">0</strong></div>
      <div class="metric"><span>Stopped</span><strong id="stopped">0</strong></div>
    </section>

    <section id="message"></section>
    <section id="groups" class="groups"></section>
  </main>

  <script>
    const groupsEl = document.querySelector("#groups");
    const messageEl = document.querySelector("#message");
    const searchEl = document.querySelector("#search");
    const refreshEl = document.querySelector("#refresh");
    const totalEl = document.querySelector("#total");
    const runningEl = document.querySelector("#running");
    const stoppedEl = document.querySelector("#stopped");

    let services = [];
    let busy = new Set();

    async function loadServices() {
      clearMessage();
      const response = await fetch("/api/services");
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || "Could not load services");
      }
      services = data.services || [];
      render();
    }

    function render() {
      const query = searchEl.value.trim().toLowerCase();
      const visible = services.filter(service => {
        const text = `${service.project} ${service.name} ${service.displayName} ${service.group} ${service.description || ""}`.toLowerCase();
        return text.includes(query);
      });

      totalEl.textContent = services.length;
      runningEl.textContent = services.filter(service => service.status === "running").length;
      stoppedEl.textContent = services.filter(service => service.status !== "running").length;

      if (!services.length) {
        groupsEl.innerHTML = "";
        messageEl.innerHTML = `
          <div class="empty">
            No services found. Add a compose file to this folder or create <code>switchboard.json</code>
            that points at your real multi-service project.
          </div>`;
        return;
      }

      if (!visible.length) {
        groupsEl.innerHTML = "";
        messageEl.innerHTML = `<div class="empty">No services match this filter.</div>`;
        return;
      }

      clearMessage();
      const grouped = visible.reduce((map, service) => {
        const key = `${service.project} / ${service.group}`;
        if (!map.has(key)) {
          map.set(key, []);
        }
        map.get(key).push(service);
        return map;
      }, new Map());
      groupsEl.innerHTML = "";

      for (const [group, groupServices] of grouped) {
        const section = document.createElement("section");
        section.className = "group";
        section.innerHTML = `
          <div class="group-title">
            <h2>${escapeHTML(group)}</h2>
            <span class="count">${groupServices.length} service${groupServices.length === 1 ? "" : "s"}</span>
          </div>
          <div class="service-grid"></div>
        `;
        const grid = section.querySelector(".service-grid");
        groupServices.forEach(service => grid.appendChild(serviceCard(service)));
        groupsEl.appendChild(section);
      }
    }

    function serviceCard(service) {
      const running = service.status === "running";
      const card = document.createElement("article");
      card.className = `service ${running ? "running" : ""} ${busy.has(service.id) ? "busy" : ""}`;
      card.innerHTML = `
        <div class="service-top">
          <div class="name">
            <strong>${escapeHTML(service.displayName)}</strong>
            <span>${escapeHTML(service.name)}</span>
          </div>
          <label class="switch" title="${running ? "Stop service" : "Start service"}">
            <input type="checkbox" ${running ? "checked" : ""}>
            <span class="slider"></span>
          </label>
        </div>
        <div class="meta">
          <span class="pill ${running ? "running" : "stopped"}">${escapeHTML(service.status)}</span>
          ${service.health ? `<span class="pill">${escapeHTML(service.health)}</span>` : ""}
          ${service.port ? `<span class="pill">:${escapeHTML(service.port)}</span>` : ""}
          ${service.dependsOn?.length ? `<span class="pill">deps ${service.dependsOn.length}</span>` : ""}
        </div>
        <p class="description">${escapeHTML(service.description || "")}</p>
        <div class="service-actions">
          ${service.url ? `<a class="link" href="${escapeAttribute(service.url)}" target="_blank" rel="noreferrer">Open</a>` : "<span></span>"}
          <button class="restart" type="button">Restart</button>
        </div>
      `;

      card.querySelector("input").addEventListener("change", event => {
        event.preventDefault();
        runAction(service, running ? "stop" : "start");
      });
      card.querySelector(".restart").addEventListener("click", () => runAction(service, "restart"));
      return card;
    }

    async function runAction(service, action) {
      busy.add(service.id);
      render();
      clearMessage();

      try {
        const response = await fetch(`/api/services/${encodeURIComponent(service.id)}`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({action})
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || `${action} failed`);
        }

        services = services.map(item => item.id === service.id ? data.service : item);
      } catch (error) {
        showError(error.message);
        await loadServices().catch(() => {});
      } finally {
        busy.delete(service.id);
        render();
      }
    }

    function showError(message) {
      messageEl.innerHTML = `<div class="error">${escapeHTML(message)}</div>`;
    }

    function clearMessage() {
      messageEl.innerHTML = "";
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function escapeAttribute(value) {
      return escapeHTML(value).replace(/`/g, "&#96;");
    }

    refreshEl.addEventListener("click", () => loadServices().catch(error => showError(error.message)));
    searchEl.addEventListener("input", render);
    loadServices().catch(error => showError(error.message));
    setInterval(() => loadServices().catch(() => {}), 15000);
  </script>
</body>
</html>
